name: Compilar iPad (IPA sin firmar)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r CelloEstudio.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CelloEstudio-ipa
          path: CelloEstudio.ipa
